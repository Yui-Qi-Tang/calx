<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc"><title id="title">Inside the logic resolver: run, parse and verify</title><desc id="desc">The backend answer, checked evidence and returned error remain separate throughout the call.</desc><defs>
<marker id="gray" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#94a3b8"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0f766e"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7c3aed"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b45309"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b91c1c"/></marker>
</defs><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
<rect width="1600" height="1100" fill="#f8fafc"/>
<text x="40" y="55" font-size="32" fill="#0f172a" font-weight="700" text-anchor="start" >Inside the logic resolver: run, parse and verify</text>
<text x="40" y="94" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >The backend answer, checked evidence and returned error remain separate throughout the call.</text>
<rect x="40" y="145" width="1520" height="100" rx="14" fill="#f5f3ff" stroke="#ddd6fe" />
<text x="64" y="182" font-size="22" fill="#7c3aed" font-weight="700" text-anchor="start" >cadical.New</text>
<text x="275" y="182" font-size="19" fill="#334155" font-weight="400" text-anchor="start" >Check executable digests → copy tools into a fresh private root → record effective limits</text>
<text x="64" y="220" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >Setup once; each Solve call then gets its own query directory and a shared solver/checker deadline.</text>
<rect x="40" y="285" width="310" height="110" rx="14" fill="white" stroke="#e2e8f0" />
<path d="M58 303 V377" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
<text x="74" y="323" font-size="21" fill="#0f172a" font-weight="700" text-anchor="start" >Context + CNF limits</text>
<text x="74" y="355" font-size="15" fill="#334155" font-weight="400" text-anchor="start" >Reject invalid or over-budget input</text>
<rect x="390" y="285" width="300" height="110" rx="14" fill="white" stroke="#e2e8f0" />
<path d="M408 303 V377" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
<text x="424" y="323" font-size="21" fill="#0f172a" font-weight="700" text-anchor="start" >Reserve query directory</text>
<text x="424" y="355" font-size="15" fill="#334155" font-weight="400" text-anchor="start" >Unique ID; install deferred Finish</text>
<rect x="730" y="285" width="360" height="110" rx="14" fill="white" stroke="#e2e8f0" />
<path d="M748 303 V377" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
<text x="764" y="323" font-size="21" fill="#0f172a" font-weight="700" text-anchor="start" >Save inputs + hashes</text>
<text x="764" y="355" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >input.json and input.cnf</text>
<rect x="1130" y="285" width="430" height="110" rx="14" fill="white" stroke="#e2e8f0" />
<path d="M1148 303 V377" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
<text x="1164" y="323" font-size="21" fill="#0f172a" font-weight="700" text-anchor="start" >Execute CaDiCaL</text>
<text x="1164" y="355" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >Record stdout / stderr / process info</text>
<path d="M350 340 H390" fill="none" stroke="#94a3b8" stroke-width="2.5"  marker-end="url(#gray)"/>
<path d="M690 340 H730" fill="none" stroke="#94a3b8" stroke-width="2.5"  marker-end="url(#gray)"/>
<path d="M1090 340 H1130" fill="none" stroke="#94a3b8" stroke-width="2.5"  marker-end="url(#gray)"/>
<path d="M1345 395 V430 H800 V450" fill="none" stroke="#7c3aed" stroke-width="2.5"  marker-end="url(#purple)"/>
<rect x="580" y="450" width="440" height="80" rx="14" fill="white" stroke="#e2e8f0" />
<path d="M598 468 V512" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
<text x="614" y="488" font-size="21" fill="#0f172a" font-weight="700" text-anchor="start" >Exit code + exact status line</text>
<path d="M800 530 V560 H275 V590" fill="none" stroke="#0f766e" stroke-width="2.5"  marker-end="url(#teal)"/>
<path d="M800 530 V590" fill="none" stroke="#7c3aed" stroke-width="2.5"  marker-end="url(#purple)"/>
<path d="M800 530 V560 H1325 V590" fill="none" stroke="#b45309" stroke-width="2.5"  marker-end="url(#amber)"/>
<rect x="40" y="590" width="470" height="285" rx="14" fill="white" stroke="#e2e8f0" />
<path d="M58 608 V857" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/>
<text x="74" y="628" font-size="21" fill="#0f172a" font-weight="700" text-anchor="start" >SAT branch (exit 10)</text>
<text x="74" y="660" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >Exact line: s SATISFIABLE</text>
<text x="74" y="687" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >Parse a total assignment</text>
<text x="74" y="714" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >Save assignment.json</text>
<text x="74" y="741" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >Check every original CNF clause</text>
<text x="74" y="768" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >Model.Checked = true</text>
<text x="74" y="795" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >TargetDigest = InputDigest</text>
<rect x="565" y="590" width="470" height="285" rx="14" fill="white" stroke="#e2e8f0" />
<path d="M583 608 V857" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
<text x="599" y="628" font-size="21" fill="#0f172a" font-weight="700" text-anchor="start" >UNSAT branch (exit 20)</text>
<text x="599" y="660" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >Exact line: s UNSATISFIABLE</text>
<text x="599" y="687" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >Require a regular, bounded proof</text>
<text x="599" y="714" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >Run DRAT-trim on input.cnf + proof</text>
<text x="599" y="741" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >Require exit 0 + exact s VERIFIED</text>
<text x="599" y="768" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >Proof.Checked = true</text>
<text x="599" y="795" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >TargetDigest = FormulaDigest</text>
<rect x="1090" y="590" width="470" height="285" rx="14" fill="white" stroke="#e2e8f0" />
<path d="M1108 608 V857" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
<text x="1124" y="628" font-size="21" fill="#0f172a" font-weight="700" text-anchor="start" >UNKNOWN branch (exit 0)</text>
<text x="1124" y="660" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >Exact line: s UNKNOWN</text>
<text x="1124" y="687" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >Return Status = UNKNOWN</text>
<text x="1124" y="714" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >No conclusive model/proof guarantee</text>
<text x="1124" y="741" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >Return error: ErrInconclusive</text>
<text x="1124" y="768" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >Retain diagnostic artifacts</text>
<rect x="40" y="905" width="1520" height="62" rx="14" fill="#fef2f2" stroke="#fecaca" />
<text x="64" y="931" font-size="18" fill="#b91c1c" font-weight="600" text-anchor="start" >Protocol mismatch, invalid model/proof, timeout, cancellation or resource failure → error.</text>
<text x="64" y="955" font-size="17" fill="#b91c1c" font-weight="400" text-anchor="start" >A partial result may retain SAT/UNSAT. Errors are never converted into an UNSAT conclusion.</text>
<rect x="40" y="990" width="1520" height="78" rx="14" fill="#eff6ff" stroke="#dbeafe" />
<text x="64" y="1022" font-size="17" fill="#1e40af" font-weight="400" text-anchor="start" >After query-directory creation, deferred Finish attempts outcome.json + the artifact inventory on every return path.</text>
<text x="64" y="1050" font-size="17" fill="#1e40af" font-weight="400" text-anchor="start" >Artifact-write or inventory failures join the returned error. Earlier failures may have no per-query artifacts.</text>
</g></svg>
