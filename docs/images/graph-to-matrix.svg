<text x="875.0" y="378" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle" data-series="target" data-row="b" data-col="e1" data-value="1">1</text>
<rect x="908" y="343" width="58" height="54" rx="7" fill="#ccfbf1" stroke="#ffffff" />
<text x="937.0" y="378" font-size="25" fill="#0f766e" font-weight="700" text-anchor="middle" data-series="target" data-row="b" data-col="e2" data-value="1">1</text>
<rect x="970" y="343" width="58" height="54" rx="7" fill="#ede9fe" stroke="#ffffff" />
<text x="999.0" y="378" font-size="25" fill="#7c3aed" font-weight="700" text-anchor="middle" data-series="target" data-row="b" data-col="e3" data-value="1">1</text>
<text x="821" y="435" font-size="19" fill="#475569" font-weight="600" text-anchor="middle" >c</text>
