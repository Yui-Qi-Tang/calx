<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="850" viewBox="0 0 1560 850" role="img" aria-labelledby="title desc">
<title id="title">Graph to incidence matrices</title>
<desc id="desc">Nodes a, b, c and edges e1 and e2 from a to b, plus e3 from b to b. Sorted node rows and edge columns align the source and target matrices and relation masks. Column e2 reconstructs a to b with relation connects. Node c has zero rows in both matrices.</desc>
<defs>
 <marker id="blue-arrow" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
 <marker id="teal-arrow" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
 <marker id="purple-arrow" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
 <marker id="gray-arrow" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
</defs>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
<rect width="1560" height="850" fill="#f8fafc"/>
<text x="40" y="55" font-size="34" fill="#0f172a" font-weight="700" text-anchor="start" >Graph edges become matrix columns</text>
<text x="40" y="95" font-size="19" fill="#334155" font-weight="400" text-anchor="start" >One row per node. One column per identified edge. Read the same column to reconstruct an edge.</text>
<rect x="40" y="140" width="400" height="550" rx="12" fill="#ffffff" stroke="#e2e8f0" />
<text x="64" y="181" font-size="16" fill="#475569" font-weight="700" text-anchor="start" >01  /  TOPOLOGY</text>
<rect x="465" y="140" width="650" height="550" rx="12" fill="#ffffff" stroke="#e2e8f0" />
<text x="489" y="181" font-size="16" fill="#475569" font-weight="700" text-anchor="start" >02  /  PROJECTION</text>
<rect x="1140" y="140" width="380" height="550" rx="12" fill="#ffffff" stroke="#e2e8f0" />
<text x="1164" y="181" font-size="16" fill="#475569" font-weight="700" text-anchor="start" >03  /  RECONSTRUCT e2</text>
<text x="64" y="216" font-size="18" fill="#0f172a" font-weight="600" text-anchor="start" >Two parallel edges, one self-loop</text>
<path d="M 136 306 C 185 235, 245 235, 290 306" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue-arrow)"/>
<path d="M 136 335 C 190 400, 245 400, 290 335" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#teal-arrow)"/>
<path d="M 335 302 C 422 230, 422 412, 335 338" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#purple-arrow)"/>
<text x="212" y="250" font-size="17" fill="#2563eb" font-weight="600" text-anchor="middle" >e1 · connects</text>
<text x="212" y="411" font-size="17" fill="#0f766e" font-weight="600" text-anchor="middle" >e2 · connects</text>
<text x="372" y="443" font-size="17" fill="#7c3aed" font-weight="600" text-anchor="middle" >e3 · loops</text>
<circle cx="110" cy="320" r="27" fill="#fff" stroke="#64748b" stroke-width="2.5"/>
<text x="110" y="328" font-size="26" fill="#0f172a" font-weight="700" text-anchor="middle" >a</text>
<circle cx="315" cy="320" r="27" fill="#fff" stroke="#64748b" stroke-width="2.5"/>
<text x="315" y="328" font-size="26" fill="#0f172a" font-weight="700" text-anchor="middle" >b</text>
<circle cx="110" cy="530" r="27" fill="#fff" stroke="#94a3b8" stroke-width="2.5"/>
<text x="110" y="538" font-size="26" fill="#0f172a" font-weight="700" text-anchor="middle" >c</text>
<text x="159" y="526" font-size="17" fill="#475569" font-weight="600" text-anchor="start" >Isolated node</text>
<text x="159" y="551" font-size="15" fill="#334155" font-weight="400" text-anchor="start" >Kept as a row in S and T</text>
<text x="64" y="617" font-size="16" fill="#334155" font-weight="400" text-anchor="start" >Edge IDs keep e1 and e2 distinct.</text>
<text x="64" y="646" font-size="16" fill="#334155" font-weight="400" text-anchor="start" >Relation labels remain opaque.</text>
