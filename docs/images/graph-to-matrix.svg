<rect x="613" y="279" width="62" height="182" rx="9" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="5 4"/>
<text x="812" y="226" font-size="23" fill="#0f172a" font-weight="700" text-anchor="start" >T / target</text>
<text x="875.0" y="266" font-size="17" fill="#2563eb" font-weight="700" text-anchor="middle" >e1</text>
<text x="937.0" y="266" font-size="17" fill="#0f766e" font-weight="700" text-anchor="middle" >e2</text>
<text x="999.0" y="266" font-size="17" fill="#7c3aed" font-weight="700" text-anchor="middle" >e3</text>
<text x="821" y="319" font-size="19" fill="#475569" font-weight="600" text-anchor="middle" >a</text>
<rect x="846" y="285" width="58" height="54" rx="7" fill="#f1f5f9" stroke="#ffffff" />
<text x="875.0" y="320" font-size="25" fill="#64748b" font-weight="400" text-anchor="middle" data-series="target" data-row="a" data-col="e1" data-value="0">0</text>
<rect x="908" y="285" width="58" height="54" rx="7" fill="#f1f5f9" stroke="#ffffff" />
<text x="937.0" y="320" font-size="25" fill="#64748b" font-weight="400" text-anchor="middle" data-series="target" data-row="a" data-col="e2" data-value="0">0</text>
<rect x="970" y="285" width="58" height="54" rx="7" fill="#f1f5f9" stroke="#ffffff" />
<text x="999.0" y="320" font-size="25" fill="#64748b" font-weight="400" text-anchor="middle" data-series="target" data-row="a" data-col="e3" data-value="0">0</text>
<text x="821" y="377" font-size="19" fill="#475569" font-weight="600" text-anchor="middle" >b</text>
