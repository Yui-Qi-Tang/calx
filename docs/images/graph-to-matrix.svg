<text x="875.0" y="436" font-size="25" fill="#64748b" font-weight="400" text-anchor="middle" data-series="target" data-row="c" data-col="e1" data-value="0">0</text>
<rect x="908" y="401" width="58" height="54" rx="7" fill="#f1f5f9" stroke="#ffffff" />
<text x="937.0" y="436" font-size="25" fill="#64748b" font-weight="400" text-anchor="middle" data-series="target" data-row="c" data-col="e2" data-value="0">0</text>
<rect x="970" y="401" width="58" height="54" rx="7" fill="#f1f5f9" stroke="#ffffff" />
<text x="999.0" y="436" font-size="25" fill="#64748b" font-weight="400" text-anchor="middle" data-series="target" data-row="c" data-col="e3" data-value="0">0</text>
<rect x="906" y="279" width="62" height="182" rx="9" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="5 4"/>
<text x="519" y="495" font-size="17" fill="#334155" font-weight="400" text-anchor="start" >Rows: node_ids = [a, b, c]</text>
<text x="519" y="522" font-size="17" fill="#334155" font-weight="400" text-anchor="start" >Columns: edge_ids = [e1, e2, e3]</text>
<text x="519" y="563" font-size="19" fill="#0f172a" font-weight="700" text-anchor="start" >Relation masks</text>
<text x="854" y="561" font-size="17" fill="#2563eb" font-weight="700" text-anchor="middle" >e1</text>
<text x="926" y="561" font-size="17" fill="#0f766e" font-weight="700" text-anchor="middle" >e2</text>
<text x="998" y="561" font-size="17" fill="#7c3aed" font-weight="700" text-anchor="middle" >e3</text>
<text x="519" y="607" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >connects</text>
<rect x="820" y="577" width="68" height="42" rx="7" fill="#dbeafe" stroke="#fff" />
<text x="854" y="606" font-size="23" fill="#2563eb" font-weight="700" text-anchor="middle" data-series="relation_masks.connects" data-col="e1" data-value="1">1</text>
<rect x="892" y="577" width="68" height="42" rx="7" fill="#ccfbf1" stroke="#fff" />
<text x="926" y="606" font-size="23" fill="#0f766e" font-weight="700" text-anchor="middle" data-series="relation_masks.connects" data-col="e2" data-value="1">1</text>
<rect x="964" y="577" width="68" height="42" rx="7" fill="#f1f5f9" stroke="#fff" />
<text x="998" y="606" font-size="23" fill="#64748b" font-weight="400" text-anchor="middle" data-series="relation_masks.connects" data-col="e3" data-value="0">0</text>
<text x="519" y="655" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >loops</text>
<rect x="820" y="625" width="68" height="42" rx="7" fill="#f1f5f9" stroke="#fff" />
<text x="854" y="654" font-size="23" fill="#64748b" font-weight="400" text-anchor="middle" data-series="relation_masks.loops" data-col="e1" data-value="0">0</text>
<rect x="892" y="625" width="68" height="42" rx="7" fill="#f1f5f9" stroke="#fff" />
<text x="926" y="654" font-size="23" fill="#64748b" font-weight="400" text-anchor="middle" data-series="relation_masks.loops" data-col="e2" data-value="0">0</text>
<rect x="964" y="625" width="68" height="42" rx="7" fill="#ede9fe" stroke="#fff" />
<text x="998" y="654" font-size="23" fill="#7c3aed" font-weight="700" text-anchor="middle" data-series="relation_masks.loops" data-col="e3" data-value="1">1</text>
<text x="1164" y="223" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >Choose edge column index 1.</text>
<circle cx="1181" cy="279" r="17" fill="#ccfbf1"/>
<text x="1181" y="285" font-size="18" fill="#0f766e" font-weight="700" text-anchor="middle" >1</text>
<text x="1210" y="284" font-size="18" fill="#0f172a" font-weight="600" text-anchor="start" >S selects row a</text>
<text x="1210" y="311" font-size="15" fill="#334155" font-weight="400" text-anchor="start" >from = node_ids[0]</text>
<circle cx="1181" cy="364" r="17" fill="#ccfbf1"/>
<text x="1181" y="370" font-size="18" fill="#0f766e" font-weight="700" text-anchor="middle" >2</text>
<text x="1210" y="369" font-size="18" fill="#0f172a" font-weight="600" text-anchor="start" >T selects row b</text>
<text x="1210" y="396" font-size="15" fill="#334155" font-weight="400" text-anchor="start" >to = node_ids[1]</text>
<circle cx="1181" cy="449" r="17" fill="#ccfbf1"/>
<text x="1181" y="455" font-size="18" fill="#0f766e" font-weight="700" text-anchor="middle" >3</text>
<text x="1210" y="454" font-size="18" fill="#0f172a" font-weight="600" text-anchor="start" >Mask selects connects</text>
<text x="1210" y="481" font-size="15" fill="#334155" font-weight="400" text-anchor="start" >relation = connects</text>
<rect x="1164" y="518" width="332" height="142" rx="12" fill="#f8fafc" stroke="#e2e8f0" />
<text x="1186" y="548" font-size="19" fill="#0f172a" font-weight="500" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">id:       e2</text>
<text x="1186" y="577" font-size="19" fill="#0f172a" font-weight="500" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">from:     a</text>
<text x="1186" y="606" font-size="19" fill="#0f172a" font-weight="500" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">to:       b</text>
<text x="1186" y="635" font-size="19" fill="#0f172a" font-weight="500" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">relation: connects</text>
<path d="M 443 360 L 460 360" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#gray-arrow)"/>
<path d="M 1118 360 L 1135 360" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#gray-arrow)"/>
<rect x="40" y="715" width="1480" height="95" rx="16" fill="#eaf2ff" stroke="#dbeafe" />
<text x="64" y="751" font-size="21" fill="#1e3a8a" font-weight="700" text-anchor="start" >One edge = one column.</text>
<text x="64" y="782" font-size="18" fill="#1e40af" font-weight="400" text-anchor="start" >Parallel edges retain separate IDs. The loop selects b in both matrices. Node c has zero rows in both matrices.</text>
</g></svg>
