<text x="582.0" y="378" font-size="25" fill="#64748b" font-weight="400" text-anchor="middle" data-series="source" data-row="b" data-col="e1" data-value="0">0</text>
<rect x="615" y="343" width="58" height="54" rx="7" fill="#f1f5f9" stroke="#ffffff" />
<text x="644.0" y="378" font-size="25" fill="#64748b" font-weight="400" text-anchor="middle" data-series="source" data-row="b" data-col="e2" data-value="0">0</text>
<rect x="677" y="343" width="58" height="54" rx="7" fill="#ede9fe" stroke="#ffffff" />
<text x="706.0" y="378" font-size="25" fill="#7c3aed" font-weight="700" text-anchor="middle" data-series="source" data-row="b" data-col="e3" data-value="1">1</text>
<text x="528" y="435" font-size="19" fill="#475569" font-weight="600" text-anchor="middle" >c</text>
