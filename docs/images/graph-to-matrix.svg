<text x="582.0" y="436" font-size="25" fill="#64748b" font-weight="400" text-anchor="middle" data-series="source" data-row="c" data-col="e1" data-value="0">0</text>
<rect x="615" y="401" width="58" height="54" rx="7" fill="#f1f5f9" stroke="#ffffff" />
<text x="644.0" y="436" font-size="25" fill="#64748b" font-weight="400" text-anchor="middle" data-series="source" data-row="c" data-col="e2" data-value="0">0</text>
<rect x="677" y="401" width="58" height="54" rx="7" fill="#f1f5f9" stroke="#ffffff" />
