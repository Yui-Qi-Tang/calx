<circle cx="1105" cy="320" r="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="1185" cy="320" r="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="1265" cy="320" r="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="1345" cy="320" r="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="1425" cy="320" r="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="1505" cy="320" r="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="40" y="480" width="745" height="390" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="66" y="520" font-size="21" fill="#0f172a" font-weight="700" text-anchor="start">Integers only</text>
<text x="66" y="550" font-size="17" fill="#334155" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">2x = 1</text>
<rect x="659" y="502" width="100" height="38" rx="19" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="709" y="527" font-size="17" fill="#b91c1c" font-weight="700" text-anchor="middle">UNSAT</text>
<text x="66" y="846" font-size="17" fill="#334155" font-weight="400" text-anchor="start">Over the reals x = 1/2 works. Variables are integers, so nothing does.</text>
<line x1="76" y1="695" x2="740" y2="695" stroke="#64748b" stroke-width="2"/>
<line x1="90" y1="688" x2="90" y2="702" stroke="#64748b" stroke-width="2"/>
