<text x="355.0" y="625" font-size="17" fill="#b91c1c" font-weight="700" text-anchor="middle">x = 1/2 is not an integer</text>
<rect x="815" y="480" width="745" height="390" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="841" y="520" font-size="21" fill="#0f172a" font-weight="700" text-anchor="start">Two variables</text>
<text x="841" y="550" font-size="17" fill="#334155" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">x + y = 4,  x - y = 2</text>
<rect x="1434" y="502" width="100" height="38" rx="19" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<text x="1484" y="527" font-size="17" fill="#0f766e" font-weight="700" text-anchor="middle">SAT</text>
<text x="841" y="846" font-size="17" fill="#334155" font-weight="400" text-anchor="start">The lines cross once, at x = 3, y = 1, which Z3 returned.</text>
<line x1="1075" y1="798" x2="1075" y2="582" stroke="#e2e8f0" stroke-width="1"/>
<text x="1075" y="822" font-size="14" fill="#334155" font-weight="400" text-anchor="middle">0</text>
