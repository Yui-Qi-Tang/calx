<text x="170" y="352" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">1</text>
<line x1="250" y1="313" x2="250" y2="327" stroke="#64748b" stroke-width="2"/>
<text x="250" y="352" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">2</text>
<line x1="330" y1="313" x2="330" y2="327" stroke="#64748b" stroke-width="2"/>
<text x="330" y="352" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">3</text>
<line x1="410" y1="313" x2="410" y2="327" stroke="#64748b" stroke-width="2"/>
<text x="410" y="352" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">4</text>
<line x1="490" y1="313" x2="490" y2="327" stroke="#64748b" stroke-width="2"/>
<text x="490" y="352" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">5</text>
<line x1="570" y1="313" x2="570" y2="327" stroke="#64748b" stroke-width="2"/>
<text x="570" y="352" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">6</text>
<line x1="650" y1="313" x2="650" y2="327" stroke="#64748b" stroke-width="2"/>
<text x="650" y="352" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">7</text>
<line x1="730" y1="313" x2="730" y2="327" stroke="#64748b" stroke-width="2"/>
<text x="730" y="352" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">8</text>
<rect x="330" y="250" width="414" height="16" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
