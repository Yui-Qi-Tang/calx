<text x="1265" y="352" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">5</text>
<line x1="1345" y1="313" x2="1345" y2="327" stroke="#64748b" stroke-width="2"/>
<text x="1345" y="352" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">6</text>
<line x1="1425" y1="313" x2="1425" y2="327" stroke="#64748b" stroke-width="2"/>
<text x="1425" y="352" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">7</text>
<line x1="1505" y1="313" x2="1505" y2="327" stroke="#64748b" stroke-width="2"/>
<text x="1505" y="352" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">8</text>
<rect x="1345" y="250" width="174" height="16" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="1345" y="240" font-size="15" fill="#2563eb" font-weight="700" text-anchor="start">x &gt;= 6</text>
