<text x="196" y="727" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">-1</text>
<line x1="302" y1="688" x2="302" y2="702" stroke="#64748b" stroke-width="2"/>
<text x="302" y="727" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">0</text>
<line x1="408" y1="688" x2="408" y2="702" stroke="#64748b" stroke-width="2"/>
<text x="408" y="727" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">1</text>
