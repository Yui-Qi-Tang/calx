<circle cx="170" cy="320" r="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="250" cy="320" r="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="330" cy="320" r="10" fill="#0f766e" stroke="none" stroke-width="2"/>
<circle cx="410" cy="320" r="10" fill="#0f766e" stroke="none" stroke-width="2"/>
<circle cx="490" cy="320" r="10" fill="#0f766e" stroke="none" stroke-width="2"/>
<circle cx="570" cy="320" r="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="650" cy="320" r="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="730" cy="320" r="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="815" y="130" width="745" height="330" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="841" y="170" font-size="21" fill="#0f172a" font-weight="700" text-anchor="start">No overlap</text>
<text x="841" y="200" font-size="17" fill="#334155" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">x &gt;= 6,  x &lt;= 5</text>
<rect x="1434" y="152" width="100" height="38" rx="19" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="1484" y="177" font-size="17" fill="#b91c1c" font-weight="700" text-anchor="middle">UNSAT</text>
<text x="841" y="436" font-size="17" fill="#334155" font-weight="400" text-anchor="start">The two ranges share no number, so no assignment exists.</text>
<line x1="851" y1="320" x2="1519" y2="320" stroke="#64748b" stroke-width="2"/>
