<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc"><title id="title">Reading linear integer problems</title><desc id="desc">Filled dots are the integers that satisfy every constraint. Each answer below came from the pinned Z3.</desc><defs>
<marker id="gray" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0f766e"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b91c1c"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b45309"/></marker>
</defs><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
<rect width="1600" height="920" fill="#f8fafc"/>
<text x="40" y="55" font-size="32" fill="#0f172a" font-weight="700" text-anchor="start">Reading linear integer problems</text>
<text x="40" y="94" font-size="18" fill="#334155" font-weight="400" text-anchor="start">Filled dots are the integers that satisfy every constraint. Each answer below came from the pinned Z3.</text>
<rect x="40" y="130" width="745" height="330" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="66" y="170" font-size="21" fill="#0f172a" font-weight="700" text-anchor="start">A range</text>
<text x="66" y="200" font-size="17" fill="#334155" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">x &gt;= 3,  x &lt;= 5</text>
<rect x="659" y="152" width="100" height="38" rx="19" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
<text x="709" y="177" font-size="17" fill="#0f766e" font-weight="700" text-anchor="middle">SAT</text>
<text x="66" y="436" font-size="17" fill="#334155" font-weight="400" text-anchor="start">Z3 returned x = 3. Any of 3, 4, 5 passes the model check.</text>
<line x1="76" y1="320" x2="744" y2="320" stroke="#64748b" stroke-width="2"/>
<line x1="90" y1="313" x2="90" y2="327" stroke="#64748b" stroke-width="2"/>
