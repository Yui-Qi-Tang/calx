<text x="726" y="727" font-size="15" fill="#334155" font-weight="400" text-anchor="middle">4</text>
<circle cx="90" cy="695" r="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="196" cy="695" r="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="302" cy="695" r="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
