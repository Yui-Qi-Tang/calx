<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc"><title id="title">Graph → matrices → logic resolver → result</title><desc id="desc">Existing Calx operations are solid arrows. The caller explicitly supplies the semantics connecting topology to logic.</desc><defs>
<marker id="gray" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#94a3b8"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0f766e"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7c3aed"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b45309"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#b91c1c"/></marker>
</defs><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
<rect width="1600" height="920" fill="#f8fafc"/>
<text x="40" y="55" font-size="32" fill="#0f172a" font-weight="700" text-anchor="start" >Graph → matrices → logic resolver → result</text>
<text x="40" y="94" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >Existing Calx operations are solid arrows. The caller explicitly supplies the semantics connecting topology to logic.</text>
<text x="40" y="152" font-size="15" fill="#2563eb" font-weight="600" text-anchor="start" >TOPOLOGY: SNAPSHOT TO INCIDENCE REPRESENTATION</text>
<rect x="40" y="185" width="270" height="160" rx="14" fill="white" stroke="#e2e8f0" />
<path d="M58 203 V327" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
<text x="74" y="223" font-size="21" fill="#0f172a" font-weight="700" text-anchor="start" >Caller topology</text>
<text x="74" y="255" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >Explicit IDs and relations</text>
<text x="74" y="282" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >Node and edge records</text>
<rect x="350" y="185" width="270" height="160" rx="14" fill="white" stroke="#e2e8f0" />
<path d="M368 203 V327" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
<text x="384" y="223" font-size="21" fill="#0f172a" font-weight="700" text-anchor="start" >incidence.Graph</text>
<text x="384" y="255" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >Caller maps IDs, endpoints</text>
<text x="384" y="282" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >and relation labels</text>
<rect x="660" y="185" width="300" height="160" rx="14" fill="white" stroke="#e2e8f0" />
<path d="M678 203 V327" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
<text x="694" y="223" font-size="21" fill="#0f172a" font-weight="700" text-anchor="start" >incidence.Project</text>
<text x="694" y="255" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >Validate IDs and endpoints</text>
<text x="694" y="282" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >Sort axes; fill S / T / masks</text>
<rect x="1000" y="185" width="560" height="160" rx="14" fill="white" stroke="#e2e8f0" />
<path d="M1018 203 V327" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
<text x="1034" y="223" font-size="21" fill="#0f172a" font-weight="700" text-anchor="start" >incidence.Projection</text>
<text x="1034" y="255" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >Source / Target / RelationMasks</text>
<text x="1034" y="282" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >NodeIDs / EdgeIDs; same identified topology</text>
<path d="M310 265 H350" fill="none" stroke="#94a3b8" stroke-width="2.5"  marker-end="url(#gray)"/>
<path d="M620 265 H660" fill="none" stroke="#94a3b8" stroke-width="2.5"  marker-end="url(#gray)"/>
<path d="M960 265 H1000" fill="none" stroke="#94a3b8" stroke-width="2.5"  marker-end="url(#gray)"/>
<rect x="40" y="400" width="1520" height="105" rx="14" fill="#fffbeb" stroke="#fcd34d" />
<text x="64" y="435" font-size="18" fill="#b45309" font-weight="700" text-anchor="start" >CALLER-AUTHORED SEMANTICS</text>
<text x="64" y="468" font-size="18" fill="#b45309" font-weight="400" text-anchor="start" >The application defines fields, guards, effects, frames and a query. Calx has no automatic incidence → rule compiler.</text>
<path d="M1280 345 V400" fill="none" stroke="#b45309" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#amber)"/>
<path d="M175 505 V575" fill="none" stroke="#b45309" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#amber)"/>
<text x="350" y="550" font-size="15" fill="#0f766e" font-weight="600" text-anchor="start" >COMPUTATION: ONE EXPLICIT FINITE QUERY</text>
<rect x="40" y="575" width="270" height="180" rx="14" fill="white" stroke="#e2e8f0" />
<path d="M58 593 V737" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
<text x="74" y="613" font-size="21" fill="#0f172a" font-weight="700" text-anchor="start" >Model + Query</text>
<text x="74" y="645" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >Fields and actions</text>
<text x="74" y="672" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >Start / Goal / Horizon</text>
<text x="74" y="699" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >Profile / Blocked paths</text>
<rect x="350" y="575" width="330" height="180" rx="14" fill="white" stroke="#e2e8f0" />
<path d="M368 593 V737" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/>
<text x="384" y="613" font-size="21" fill="#0f172a" font-weight="700" text-anchor="start" >finite.Compile</text>
<text x="384" y="645" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >Validate → Project → encode</text>
<text x="384" y="672" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >Guard / Effect / Frame</text>
<text x="384" y="699" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >Owned CNF + decoding map</text>
<rect x="720" y="575" width="200" height="180" rx="14" fill="white" stroke="#e2e8f0" />
<path d="M738 593 V737" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/>
<text x="754" y="613" font-size="21" fill="#0f172a" font-weight="700" text-anchor="start" >sat.CNF</text>
<text x="754" y="645" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >Variable IDs</text>
<text x="754" y="672" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >Signed clauses</text>
<text x="754" y="699" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >One exact query</text>
<rect x="960" y="575" width="270" height="180" rx="14" fill="white" stroke="#e2e8f0" />
<path d="M978 593 V737" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
<text x="994" y="613" font-size="21" fill="#0f172a" font-weight="700" text-anchor="start" >Runner.Solve</text>
<text x="994" y="645" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >CaDiCaL + DRAT-trim</text>
<text x="994" y="672" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >Answer-specific checks</text>
<text x="994" y="699" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >Preserved artifacts</text>
<rect x="1270" y="575" width="290" height="180" rx="14" fill="white" stroke="#e2e8f0" />
<path d="M1288 593 V737" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
<text x="1304" y="613" font-size="21" fill="#0f172a" font-weight="700" text-anchor="start" >Result + error</text>
<text x="1304" y="645" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >Status / Model / Proof</text>
<text x="1304" y="672" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >Assignment / Artifacts</text>
<text x="1304" y="699" font-size="18" fill="#334155" font-weight="400" text-anchor="start" >Input and formula hashes</text>
<path d="M310 665 H350" fill="none" stroke="#0f766e" stroke-width="2.5"  marker-end="url(#teal)"/>
<path d="M680 665 H720" fill="none" stroke="#0f766e" stroke-width="2.5"  marker-end="url(#teal)"/>
<path d="M920 665 H960" fill="none" stroke="#0f766e" stroke-width="2.5"  marker-end="url(#teal)"/>
<path d="M1230 665 H1270" fill="none" stroke="#0f766e" stroke-width="2.5"  marker-end="url(#teal)"/>
<rect x="40" y="805" width="1520" height="75" rx="14" fill="#eff6ff" stroke="#dbeafe" />
<text x="64" y="835" font-size="18" fill="#1e40af" font-weight="400" text-anchor="start" >Consumers can also supply CNF directly. AHE need not pass through a matrix; Lab may retain its own encoder.</text>
<text x="64" y="862" font-size="18" fill="#1e40af" font-weight="400" text-anchor="start" >For finite SAT traces, retain the original Encoding and use its Decode method after successful checks.</text>
</g></svg>
